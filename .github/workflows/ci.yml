name: TinyTalk CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-certify-windows:
    name: Native Test & Gatekeeper (Windows - Py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel numpy tomli

      - name: Run Full Unit Test Discovery Suite (315 Tests)
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run 5-Stage Zero-Defect Gatekeeper
        run: |
          python tnt.py gatekeeper

      - name: Verify Flagship HFT Engine Native JIT Execution
        run: |
          python tnt.py run examples/tinytalk_hft_engine.tnt --stats

      - name: Test Multi-Target Native Compilation Matrix
        run: |
          python tnt.py build examples/tinytalk_hft_engine.tnt --target all

      - name: Test Wheel & Source Distribution Packaging
        run: |
          python setup.py sdist bdist_wheel

  cross-platform-matrix:
    name: Cross-Platform Build & Packaging (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel tomli

      - name: Test Multi-Target Cross-Compilation Matrix (ELF64, Mach-O, WASM, C11, LLVM)
        run: |
          python tnt.py build examples/tinytalk_hft_engine.tnt --target all

      - name: Test Wheel & Source Distribution Packaging
        run: |
          python setup.py sdist bdist_wheel

  release-artifacts:
    name: Package Release Distributions
    needs: [test-and-certify-windows, cross-platform-matrix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Wheel and Tarball
        run: |
          python -m pip install --upgrade pip build wheel setuptools tomli
          python setup.py sdist bdist_wheel

      - name: Package VS Code Extension (.vsix)
        shell: bash
        run: |
          cd editors/vscode
          npx --yes @vscode/vsce package --out ../../dist/ --allow-missing-repository || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

      - name: Attach Assets to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/tinytalk* --clobber || true

  pypi-publish:
    name: Publish to PyPI (Trusted Publisher)
    needs: [release-artifacts]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tinytalk-lang
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Built Distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Verify Package Metadata with Twine
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check dist/*.whl dist/*.tar.gz

      - name: Publish Package Distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
        continue-on-error: true
