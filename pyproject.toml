[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackmamba-lang"
version = "2.0.0"
description = "Black Mamba (.bmb) — High-Speed, Zero-Cost-Abstraction Programming Language & Multi-Target Compiler"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "KiCode", email = "kicode01@users.noreply.github.com" },
]
keywords = [
  "compiler",
  "jit",
  "programming-language",
  "python",
  "performance",
  "systems-programming",
  "webassembly",
  "x86-64",
  "zero-cost-abstractions",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Interpreters",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://blackmamba-lang.vercel.app"
Documentation = "https://github.com/kicode01/blackmamba-lang#readme"
Repository = "https://github.com/kicode01/blackmamba-lang.git"
"Web Arena" = "https://blackmamba-lang.vercel.app/arena.html"
"Bug Tracker" = "https://github.com/kicode01/blackmamba-lang/issues"

[project.scripts]
bmb = "mamba.cli:main"
blackmamba = "mamba.cli:main"

[tool.setuptools.packages.find]
include = ["mamba*"]

[tool.setuptools.package-data]
"mamba" = ["stdlib/*.bmb"]
